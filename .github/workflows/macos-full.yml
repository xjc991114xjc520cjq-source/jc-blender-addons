name: Build full Apple Silicon plugins
on:
  push:
    branches: [codex/macos-apple-silicon]
    paths: [macos/build_full.py, .github/workflows/macos-full.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/cache/restore@v4
        id: engines
        with:
          path: |
            macos/jc-auto-import/jc_auto_import/bin
            macos/jc-auto-import/jc_auto_import/capabilities.json
            ${{ runner.temp }}/jc-native-build/visibility.c4d
          key: native-engines-${{ hashFiles('macos/build_full.py', 'plugins/jc-auto-import/engine/assimp-jc.patch') }}
      - name: Build native conversion and CAD engines
        if: steps.engines.outputs.cache-hit != 'true'
        run: python macos/build_full.py
      - uses: actions/cache/save@v4
        if: steps.engines.outputs.cache-hit != 'true'
        with:
          path: |
            macos/jc-auto-import/jc_auto_import/bin
            macos/jc-auto-import/jc_auto_import/capabilities.json
            ${{ runner.temp }}/jc-native-build/visibility.c4d
          key: native-engines-${{ hashFiles('macos/build_full.py', 'plugins/jc-auto-import/engine/assimp-jc.patch') }}
      - name: Install Blender arm64 for conversion acceptance
        run: |
          curl --fail --location --retry 3 https://download.blender.org/release/Blender5.2/blender-5.2.4-macos-arm64.dmg -o "$RUNNER_TEMP/blender.dmg"
          hdiutil attach "$RUNNER_TEMP/blender.dmg" -mountpoint "$RUNNER_TEMP/blender-volume" -nobrowse
          cp -R "$RUNNER_TEMP/blender-volume/Blender.app" "$RUNNER_TEMP/Blender.app"
          hdiutil detach "$RUNNER_TEMP/blender-volume"
          echo "BLENDER=$RUNNER_TEMP/Blender.app/Contents/MacOS/Blender" >> "$GITHUB_ENV"
      - name: Run original conversion and fidelity regressions on Apple Silicon
        run: |
          python macos/jc-auto-import/tests/test_conversion.py --blender "$BLENDER" -v
          python macos/jc-auto-import/tests/test_step.py --blender "$BLENDER"
          python macos/jc-auto-import/tests/test_c4d_fidelity.py --blender "$BLENDER" --fixture "$RUNNER_TEMP/jc-native-build/visibility.c4d"
          "$BLENDER" --background --factory-startup --python-exit-code 1 --python macos/tests/test_blender_registration.py
      - name: Test Mac Agent protocol and prompt regressions
        run: |
          python -m pip install mcp==1.26.0 pillow
          python macos/tests/test_agent.py
          python macos/jc-blender-agent/tests/test_bridge.py -v
      - name: Package full macOS builds
        run: |
          python macos/build.py --full
          python macos/tests/test_macos.py
      - name: Verify installed ZIP after relocation
        run: |
          python macos/tests/test_installed_package.py --blender "$BLENDER" --fixture "$RUNNER_TEMP/jc-native-build/visibility.c4d" --archive packages/macos/JC-Auto-Import-1.0.4-macOS-AppleSilicon-r2.zip
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: macos-full-native
          path: |
            packages/macos/*
          retention-days: 14
